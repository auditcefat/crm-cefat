function statut(txt){ const e=document.getElementById("etat"); if(e) e.textContent = txt; }
function heureCourte(){ return new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function ok(){ statut("Synchronisé à "+heureCourte()); }

function ligneMatch(m){
  return {id:m.id, abo:m.abo, date:m.date||"", heure:m.heure||"", adv:m.adv,
          comp:m.comp, conf:!!m.conf, note:m.note||"", att:m.att};
}
async function lireBase(){
  const [rm, ri] = await Promise.all([
    sb.from("invit_matchs").select("*"),
    sb.from("invit_invites").select("*")
  ]);
  if(rm.error) throw rm.error;
  if(ri.error) throw ri.error;
  const matchs = rm.data.map(r=>({
    id:r.id, abo:r.abo, date:r.date||"", heure:r.heure||"", adv:r.adv||"",
    comp:r.comp||"", conf:!!r.conf, note:r.note||"", att:Array.isArray(r.att)?r.att:[]
  }));
  matchs.forEach(m=>{
    const a = abo(m.abo);
    while(a && m.att.length < a.places) m.att.push("");
  });
  matchs.sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
  return {matchs, invites:ri.data.map(r=>({
    id:r.id, nom:r.nom||"", prenom:r.prenom||"", societe:r.societe||"",
    tel:r.tel||"", mail:r.mail||"", note:r.note||""
  }))};
}
async function sauveMatch(id){
  const m = S.matchs.find(x=>x.id===id); if(!m) return;
  statut("Enregistrement…");
  const {error} = await sb.from("invit_matchs").upsert(ligneMatch(m));
  if(error){ statut("Échec de l'enregistrement — vérifiez la connexion"); return; }
  ok();
}
async function sauveInvite(id){
  const g = S.invites.find(x=>x.id===id); if(!g) return;
  statut("Enregistrement…");
  const {error} = await sb.from("invit_invites").upsert(g);
  if(error){ statut("Échec de l'enregistrement — vérifiez la connexion"); return; }
  ok();
}
async function supprimeInviteBase(id){
  await sb.from("invit_invites").delete().eq("id", id);
  ok();
}
function save(cible){
  if(!cible) return;
  if(cible.match) sauveMatch(cible.match);
  if(cible.invite) sauveInvite(cible.invite);
  if(cible.matchs) cible.matchs.forEach(sauveMatch);
}
function graine(){
  const invites = INVITES_SEED.map(r=>({id:slug(r[0],r[1]), nom:r[0], prenom:r[1],
      societe:r[2], tel:r[3], mail:r[4], note:r[5]}));
  const matchs = [];
  MATCHS_SEED.forEach((m,i)=>{
    const a = ABOS.find(x=>x.id===m[0]);
    const att = new Array(a.places).fill("");
    a.titulaires.forEach((t,k)=>{ att[k]=t; });
    matchs.push({id:"m"+i, abo:m[0], date:m[1], heure:m[2], adv:m[3], comp:m[4], conf:m[5], att, note:""});
  });
  AJOUTS.forEach(a=>{
    const ab = ABOS.find(x=>x.id===a[1]);
    const att = new Array(ab.places).fill("");
    ab.titulaires.forEach((t,k)=>{ att[k]=t; });
    matchs.push({id:a[0], abo:a[1], date:a[2], heure:a[3], adv:a[4], comp:a[5], conf:a[6], att, note:a[7]||""});
  });
  return {matchs, invites};
}
async function semer(d){
  statut("Initialisation du planning…");
  const paquets = (t,n)=>{ const r=[]; for(let i=0;i<t.length;i+=n) r.push(t.slice(i,i+n)); return r; };
  for(const p of paquets(d.invites,50)) await sb.from("invit_invites").upsert(p);
  for(const p of paquets(d.matchs.map(ligneMatch),40)) await sb.from("invit_matchs").upsert(p);
}
async function synchroniser(){
  if(document.querySelector(".modal.on")) return;
  const a = document.activeElement;
  if(a && (a.tagName==="INPUT" || a.tagName==="SELECT" || a.tagName==="TEXTAREA")) return;
  try{
    const d = await lireBase();
    const sig = JSON.stringify(d);
    if(sig === DERNIERE) return;
    DERNIERE = sig; S = d;
    const ouverts=[...document.querySelectorAll(".match.open")].map(e=>e.id);
    render();
    ouverts.forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.add("open"); });
    ok();
  }catch(e){ statut("Connexion perdue — rechargez la page"); }
}
async function rafraichir(){ DERNIERE=""; statut("Actualisation…"); await synchroniser(); }

/* ---------- état ---------- */
let S = null, ONGLET="matchs", FILTRE="all", RECHERCHE="", MASQUE_PASSES=true, MDL_CTX=null;

function slug(n,p){
  return (n+"-"+p).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
async function init(){
  statut("Connexion à la base…");
  let d = await lireBase();
  if(!d.matchs.length){ await semer(graine()); d = await lireBase(); }
  S = d; DERNIERE = JSON.stringify(d);
  ok();
}
function inv(id){ return S.invites.find(i=>i.id===id); }
function nomComplet(i){ return i ? (i.prenom ? i.nom+" "+i.prenom : i.nom) : ""; }
function abo(id){ return ABOS.find(a=>a.id===id); }

/* ---------- rendu ---------- */
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fmtDate(d){
  if(!d) return {j:"—",d:"?",m:"date à définir"};
  const o=new Date(d+"T12:00:00");
  return {j:JOURS[o.getDay()], d:o.getDate(), m:MOIS[o.getMonth()]+" "+o.getFullYear()};
}
function estPasse(m){
  if(!m.date) return false;
  return new Date(m.date+"T23:59:59") < new Date();
}
function libres(m){ return m.att.filter(x=>!x).length; }

function render(){
  document.getElementById("nav").innerHTML =
    [["matchs","Matchs & places"],["invites","Annuaire des invités"],["recap","Récapitulatif"]]
    .map(t=>`<button class="${ONGLET===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");
  const m=document.getElementById("main");
  if(ONGLET==="matchs") m.innerHTML=vueMatchs();
  else if(ONGLET==="invites") m.innerHTML=vueInvites();
  else m.innerHTML=vueRecap();
}
function go(t){ ONGLET=t; render(); }

function vueMatchs(){
  let ms = S.matchs.filter(m=>FILTRE==="all"||m.abo===FILTRE);
  if(MASQUE_PASSES) ms = ms.filter(m=>!estPasse(m));
  if(RECHERCHE){
    const q=RECHERCHE.toLowerCase();
    ms = ms.filter(m=> (m.adv+" "+m.comp).toLowerCase().includes(q)
      || m.att.some(a=>a && nomComplet(inv(a)).toLowerCase().includes(q)));
  }
  ms.sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
  const tot = ms.reduce((s,m)=>s+m.att.length,0), lib = ms.reduce((s,m)=>s+libres(m),0);
  const aVenir = ms.filter(m=>m.date).length;

  let h = `<div class="bar">
    <div><label class="f">Abonnement</label><select onchange="FILTRE=this.value;render()">
      <option value="all"${FILTRE==="all"?" selected":""}>Tous les abonnements</option>
      ${ABOS.map(a=>`<option value="${a.id}"${FILTRE===a.id?" selected":""}>${a.nom} — ${a.places} places</option>`).join("")}
    </select></div>
    <div><label class="f">Rechercher</label><input value="${RECHERCHE}" placeholder="Adversaire ou invité" oninput="RECHERCHE=this.value;render()" style="width:220px"></div>
    <div><label class="f">Matchs passés</label><select onchange="MASQUE_PASSES=this.value==='1';render()">
      <option value="1"${MASQUE_PASSES?" selected":""}>Masqués</option><option value="0"${!MASQUE_PASSES?" selected":""}>Affichés</option></select></div>
    <div style="flex:1"></div>
    <button class="btn-s" onclick="ouvrirTout(true)">Tout déplier</button>
    <button class="btn-s" onclick="ouvrirTout(false)">Tout replier</button>
  </div>
  <div class="stats">
    <div class="stat"><b>${ms.length}</b><span>matchs affichés</span></div>
    <div class="stat"><b>${tot}</b><span>places au total</span></div>
    <div class="stat"><b>${tot-lib}</b><span>places attribuées</span></div>
    <div class="stat"><b>${lib}</b><span>places libres</span></div>
    <div class="stat"><b>${aVenir}</b><span>dates connues</span></div>
  </div>`;

  h += `<div class="info">
    <b>Planning partagé</b>
    Tout le monde travaille sur la même base. Les saisies des autres apparaissent automatiquement, en quelques secondes, sans rien cliquer.
    Chaque match est enregistré séparément : deux personnes peuvent remplir deux matchs en même temps sans risque d'effacement.
  </div>
  <div class="info">
    <b>Quand les horaires sont-ils connus ?</b>
    Section Paloise et BOPB : la LNR fixe jour et horaire environ un mois avant, au fil des choix TV. Élan Béarnais : horaires communiqués par le club au fil de la saison.
    Real Sociedad : les dates viennent du calendrier officiel RFEF ; LaLiga ne fixe le jour exact dans le week-end et l'heure que 15 à 20 jours avant.
    Ligue Europa : journées et horaires publiés par l'UEFA après le tirage. Corrigez date et heure directement dans le match, la modification profite à tout le monde.
  </div>`;
  if(!ms.length) return h+`<div class="empty">Aucun match ne correspond à ce filtre.</div>`;

  let dernierMois="";
  ms.forEach(m=>{
    const f=fmtDate(m.date);
    const cle = m.date ? f.m : "Dates à définir";
    if(cle!==dernierMois){ h+=`<div class="section-t">${cle}</div>`; dernierMois=cle; }
    h+=carteMatch(m,f);
  });
  return h;
}

function carteMatch(m,f){
  const a=abo(m.abo), lib=libres(m), pris=m.att.length-lib;
  const pct = Math.round(pris/m.att.length*100);
  return `<div class="match ${m.abo}" id="c_${m.id}">
    <div class="head" onclick="basculer('${m.id}')">
      <div class="date"><div class="j">${f.j}</div><div class="d">${f.d}</div><div class="m">${m.date?f.m:'à définir'}</div>
        <div class="h">${m.heure||"heure ?"}</div></div>
      <div class="titre">
        <b>${a.nom} — ${m.adv}</b>
        <div class="meta">${m.comp} · ${a.lieu}</div>
        <div style="margin-top:4px">
          ${m.conf?'<span class="tag conf">Date et heure confirmées</span>':'<span class="tag appr">Date/heure à confirmer</span>'}
          ${m.note?`<span class="tag comp">${m.note}</span>`:""}
        </div>
      </div>
      <div class="jauge">
        <div class="n ${lib===0?'full':'vide'}">${pris}/${m.att.length} places</div>
        <div class="bar2"><i style="width:${pct}%"></i></div>
        <div class="meta" style="margin-top:3px">${lib} libre${lib>1?'s':''}</div>
      </div>
    </div>
    <div class="body">
      <div class="places">${m.att.map((v,i)=>ligne(m,i,v)).join("")}</div>
      <div class="editdate">
        <div><label class="f">Date</label><input type="date" value="${m.date}" onchange="majMatch('${m.id}','date',this.value)"></div>
        <div><label class="f">Heure</label><input type="time" value="${m.heure}" onchange="majMatch('${m.id}','heure',this.value)"></div>
        <div><label class="f">Adversaire</label><input value="${m.adv}" onchange="majMatch('${m.id}','adv',this.value)" style="width:190px"></div>
        <div><label class="f">Note</label><input value="${m.note||''}" placeholder="Réception, parking, voiture…" onchange="majMatch('${m.id}','note',this.value)" style="width:200px"></div>
        <div><label class="f">Statut</label><select onchange="majMatch('${m.id}','conf',this.value==='1')">
          <option value="0"${!m.conf?" selected":""}>À confirmer</option><option value="1"${m.conf?" selected":""}>Confirmé</option></select></div>
        <button class="btn-s" onclick="viderMatch('${m.id}')">Vider les places</button>
        <button class="btn-s" onclick="remettreTitulaires('${m.id}')">Remettre les titulaires</button>
      </div>
    </div>
  </div>`;
}

function ligne(m,i,v){
  const a=abo(m.abo);
  const estTit = i < a.titulaires.length;
  const opts = S.invites.slice().sort((x,y)=>nomComplet(x).localeCompare(nomComplet(y),"fr"))
    .map(x=>`<option value="${x.id}"${x.id===v?" selected":""}>${nomComplet(x)}${x.societe?" — "+x.societe:""}</option>`).join("");
  return `<div class="place ${estTit?'tit':''} ${v?'':'vide'}">
    <div class="num">${i+1}</div>
    <select onchange="affecte('${m.id}',${i},this.value)">
      <option value="">— place libre —</option>${opts}
    </select>
    <button class="btn-x" title="Créer un invité et l'affecter" onclick="ouvrirMdl('${m.id}',${i})">+</button>
    ${v?`<button class="btn-x" title="Libérer la place" onclick="affecte('${m.id}',${i},'')">✕</button>`:""}
  </div>`;
}

function vueInvites(){
  const q=RECHERCHE.toLowerCase();
  let list=S.invites.slice().sort((a,b)=>nomComplet(a).localeCompare(nomComplet(b),"fr"));
  if(q) list=list.filter(i=>(i.nom+" "+i.prenom+" "+i.societe+" "+i.note).toLowerCase().includes(q));
  const compte = {};
  S.matchs.forEach(m=>m.att.forEach(x=>{ if(x) compte[x]=(compte[x]||0)+1; }));
  return `<div class="bar">
      <div><label class="f">Rechercher</label><input value="${RECHERCHE}" placeholder="Nom, société, catégorie" oninput="RECHERCHE=this.value;render()" style="width:280px"></div>
      <div style="flex:1"></div>
      <button class="btn-p" onclick="ouvrirMdl(null,null)">Ajouter un invité</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${S.invites.length}</b><span>invités enregistrés</span></div>
      <div class="stat"><b>${Object.keys(compte).length}</b><span>invités placés cette saison</span></div>
    </div>
    <table><thead><tr><th>Nom</th><th>Prénom</th><th>Société</th><th>Téléphone</th><th>E-mail</th><th>Catégorie</th><th>Places</th><th></th></tr></thead>
    <tbody>${list.map(i=>`<tr>
      <td><b>${i.nom}</b></td><td>${i.prenom||""}</td><td>${i.societe||""}</td>
      <td>${i.tel||""}</td><td>${i.mail||""}</td><td>${i.note?`<span class="pill">${i.note}</span>`:""}</td>
      <td>${compte[i.id]||0}</td>
      <td style="white-space:nowrap">
        <button class="btn-x" onclick="editInvite('${i.id}')">Modifier</button>
        <button class="btn-x" onclick="supprInvite('${i.id}')">Supprimer</button></td>
    </tr>`).join("")}</tbody></table>`;
}

function vueRecap(){
  const parAbo = ABOS.map(a=>{
    const ms=S.matchs.filter(m=>m.abo===a.id);
    const tot=ms.reduce((s,m)=>s+m.att.length,0), lib=ms.reduce((s,m)=>s+libres(m),0);
    return `<div class="stat"><b>${tot-lib}/${tot}</b><span>${a.nom} · ${ms.length} matchs</span></div>`;
  }).join("");
  const rows=[];
  S.matchs.slice().sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")).forEach(m=>{
    if(MASQUE_PASSES && estPasse(m)) return;
    const f=fmtDate(m.date);
    rows.push(`<tr>
      <td style="white-space:nowrap">${m.date?f.j+" "+f.d+" "+f.m:"—"}<br><span class="pill">${m.heure||"heure ?"}</span></td>
      <td><b>${abo(m.abo).nom}</b><br><span class="hint">${m.comp}</span></td>
      <td>${m.adv}</td>
      <td>${m.att.map((x,i)=>x?`<span class="pill">${i+1}. ${nomComplet(inv(x))}</span>`:`<span class="pill" style="color:#B4531F">${i+1}. libre</span>`).join(" ")}</td>
      <td style="text-align:center">${m.att.length-libres(m)}/${m.att.length}</td></tr>`);
  });
  return `<div class="stats">${parAbo}</div>
   <div class="bar"><div><label class="f">Matchs passés</label><select onchange="MASQUE_PASSES=this.value==='1';render()">
      <option value="1"${MASQUE_PASSES?" selected":""}>Masqués</option><option value="0"${!MASQUE_PASSES?" selected":""}>Affichés</option></select></div>
      <div style="flex:1"></div><button class="btn-s" onclick="exportCSV()">Exporter en CSV</button></div>
   <table><thead><tr><th style="width:130px">Date</th><th style="width:170px">Abonnement</th><th style="width:150px">Adversaire</th><th>Places</th><th style="width:70px">Taux</th></tr></thead>
   <tbody>${rows.join("")}</tbody></table>`;
}

/* ---------- actions ---------- */
function basculer(id){ document.getElementById("c_"+id).classList.toggle("open"); }
function ouvrirTout(o){ document.querySelectorAll(".match").forEach(e=>e.classList.toggle("open",o)); }
function affecte(mid,i,val){
  const m=S.matchs.find(x=>x.id===mid);
  if(val && m.att.some((v,k)=>v===val && k!==i)){
    if(!confirm(nomComplet(inv(val))+" occupe déjà une place sur ce match. Confirmer quand même ?")) { render(); return; }
  }
  m.att[i]=val; save({match:mid});
  const ouverts=[...document.querySelectorAll(".match.open")].map(e=>e.id);
  render(); ouverts.forEach(id=>{const e=document.getElementById(id); if(e) e.classList.add("open");});
}
function majMatch(mid,champ,val){
  const m=S.matchs.find(x=>x.id===mid); m[champ]=val;
  if(champ==="date"||champ==="heure") m.conf = !!(m.date&&m.heure);
  save({match:mid});
  const ouverts=[...document.querySelectorAll(".match.open")].map(e=>e.id);
  render(); ouverts.forEach(id=>{const e=document.getElementById(id); if(e) e.classList.add("open");});
}
function viderMatch(mid){
  if(!confirm("Libérer toutes les places de ce match ?")) return;
  const m=S.matchs.find(x=>x.id===mid); m.att=m.att.map(()=>""); save({match:mid}); render();
}
function remettreTitulaires(mid){
  const m=S.matchs.find(x=>x.id===mid), a=abo(m.abo);
  a.titulaires.forEach((t,k)=>{ m.att[k]=t; }); save({match:mid}); render();
}
function ouvrirMdl(mid,i){
  MDL_CTX={mid,i,edit:null};
  document.getElementById("mdlT").textContent="Nouvel invité";
  ["i_nom","i_pre","i_soc","i_tel","i_mail","i_note"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("mdl").classList.add("on");
  document.getElementById("i_nom").focus();
}
function editInvite(id){
  const x=inv(id); MDL_CTX={mid:null,i:null,edit:id};
  document.getElementById("mdlT").textContent="Modifier l'invité";
  document.getElementById("i_nom").value=x.nom; document.getElementById("i_pre").value=x.prenom;
  document.getElementById("i_soc").value=x.societe; document.getElementById("i_tel").value=x.tel;
  document.getElementById("i_mail").value=x.mail; document.getElementById("i_note").value=x.note||"";
  document.getElementById("mdl").classList.add("on");
}
function fermeMdl(){ document.getElementById("mdl").classList.remove("on"); MDL_CTX=null; }
let DERNIER_ID = "";
function validerInvite(){
  const v=id=>document.getElementById(id).value.trim();
  if(!v("i_nom")){ alert("Le nom est obligatoire."); return; }
  if(MDL_CTX.edit){
    const x=inv(MDL_CTX.edit);
    x.nom=v("i_nom"); x.prenom=v("i_pre"); x.societe=v("i_soc"); x.tel=v("i_tel"); x.mail=v("i_mail"); x.note=v("i_note");
  }else{
    let id=slug(v("i_nom"),v("i_pre")), n=1;
    while(inv(id)){ id=slug(v("i_nom"),v("i_pre"))+"-"+(++n); }
    S.invites.push({id, nom:v("i_nom"), prenom:v("i_pre"), societe:v("i_soc"), tel:v("i_tel"), mail:v("i_mail"), note:v("i_note")});
    DERNIER_ID = id;
    if(MDL_CTX.mid!==null && MDL_CTX.mid!==undefined){
      const m=S.matchs.find(x=>x.id===MDL_CTX.mid); if(m) m.att[MDL_CTX.i]=id;
    }
  }
  const cible = MDL_CTX.edit || DERNIER_ID;
  save({invite:cible, matchs: MDL_CTX.mid ? [MDL_CTX.mid] : []});
  fermeMdl(); render();
}
function supprInvite(id){
  const places=S.matchs.reduce((s,m)=>s+m.att.filter(x=>x===id).length,0);
  if(!confirm("Supprimer "+nomComplet(inv(id))+" de l'annuaire ?"+(places?" Il occupe "+places+" place(s), qui seront libérées.":""))) return;
  const touches = S.matchs.filter(m=>m.att.includes(id)).map(m=>m.id);
  S.matchs.forEach(m=>m.att=m.att.map(x=>x===id?"":x));
  S.invites=S.invites.filter(x=>x.id!==id);
  save({matchs:touches}); supprimeInviteBase(id); render();
}
function exportCSV(){
  const l=[["Abonnement","Competition","Date","Heure","Statut","Adversaire","Lieu","Place","Invite","Societe","Telephone","Email","Note match"]];
  S.matchs.slice().sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")).forEach(m=>{
    const a=abo(m.abo);
    m.att.forEach((x,i)=>{
      const g=x?inv(x):null;
      l.push([a.nom,m.comp,m.date||"à définir",m.heure||"à définir",m.conf?"confirmé":"à confirmer",m.adv,a.lieu,i+1,
        g?nomComplet(g):"LIBRE", g?g.societe:"", g?g.tel:"", g?g.mail:"", m.note||""]);
    });
  });
  const csv="\uFEFF"+l.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n");
  dl(new Blob([csv],{type:"text/csv"}),"invitations-cefat-2026-2027.csv");
}
function sauvegarde(){ dl(new Blob([JSON.stringify(S)],{type:"application/json"}),"sauvegarde-invitations-cefat.json"); }
function restaure(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{ try{ const d=JSON.parse(r.result); await semer(d); await rafraichir();
      alert("Sauvegarde restaurée dans la base partagée."); }
    catch(e){ alert("Fichier illisible."); } };
  r.readAsText(f); input.value="";
}
function dl(blob,nom){
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=nom; a.click(); URL.revokeObjectURL(u);
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") fermeMdl(); });
document.getElementById("main").innerHTML = '<div class="empty">Chargement du planning…</div>';
init().then(()=>{
  render();
  setInterval(synchroniser, 10000);
  window.addEventListener("focus", synchroniser);
}).catch(e=>{
  document.getElementById("main").innerHTML =
    '<div class="empty">Impossible de joindre la base de données.<br>Vérifiez la connexion, ou que le projet Supabase n\'est pas en veille, puis rechargez la page.</div>';
});
</script>
